# ─────────────────────────────────────────────────────────────────────────────
# Nginx — api.prithvigrid.com
# Reverse proxy to @prithvi/api (Node.js + Socket.IO on localhost:3001)
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zone (define in http block of nginx.conf or here with limit_req_zone)
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.prithvigrid.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS + WebSocket-aware reverse proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.prithvigrid.com;

    # ── SSL Certificates ───────────────────────────────────────────────────
    # Managed by Certbot / Let's Encrypt. Replace paths if using a custom CA.
    ssl_certificate     /etc/letsencrypt/live/api.prithvigrid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.prithvigrid.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.prithvigrid.com/chain.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── CORS (handled by Express; nginx passes through) ───────────────────
    # If you want nginx-level CORS, add headers here.

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/api.prithvigrid.com.access.log combined;
    error_log  /var/log/nginx/api.prithvigrid.com.error.log warn;

    # ── Client upload limit (for photo verification payloads) ─────────────
    client_max_body_size 20M;

    # ── WebSocket upgrade map (Socket.IO) ─────────────────────────────────
    # Connection upgrade headers for Socket.IO long-polling + WebSocket
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # ── Common proxy headers ───────────────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Timeouts (generous for long-polling + AI calls) ────────────────────
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ── Rate limiting (optional — uncomment to activate) ──────────────────
    # limit_req zone=api_limit burst=50 nodelay;

    # ── Main proxy pass ───────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3001;
    }

    # ── Socket.IO namespace (explicit for clarity) ─────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
    }

    # ── Health check endpoint (bypass rate limit) ─────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }
}
