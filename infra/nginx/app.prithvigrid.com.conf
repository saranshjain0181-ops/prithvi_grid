# ─────────────────────────────────────────────────────────────────────────────
# Nginx — app.prithvigrid.com
# Serves the @prithvi/app React PWA (static build at /var/www/app/dist)
# ─────────────────────────────────────────────────────────────────────────────

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.prithvigrid.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.prithvigrid.com;

    # ── SSL Certificates ───────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/app.prithvigrid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.prithvigrid.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.prithvigrid.com/chain.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # PWA requires service worker access — do not set X-Frame-Options: DENY
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    # ── Document root ─────────────────────────────────────────────────────
    root /var/www/app/dist;
    index index.html;

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/app.prithvigrid.com.access.log combined;
    error_log  /var/log/nginx/app.prithvigrid.com.error.log warn;

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Static asset caching (Vite hashed filenames) ──────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # ── Service Worker — must NOT be cached ───────────────────────────────
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Type "application/manifest+json";
    }

    # ── SPA fallback — all routes serve index.html ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
