# ─────────────────────────────────────────────────────────────────────────────
# Nginx — hq.prithvigrid.com
# Serves the @prithvi/hq Admin Portal (static build at /var/www/hq/dist)
# IP-restricted: only Supreme Head office + authorised Technician IPs allowed.
# ─────────────────────────────────────────────────────────────────────────────

# ── Allowlist: update with real office / VPN IP ranges ────────────────────────
geo $hq_allowed {
    default          0;

    # Supreme Head Office (example — replace with real IPs)
    203.0.113.10     1;   # Supreme Head — static office IP
    203.0.113.11     1;   # Backup office IP

    # Authorised field technicians (static / VPN)
    198.51.100.20    1;   # Technician 1
    198.51.100.21    1;   # Technician 2
    198.51.100.22    1;   # Technician 3

    # Internal / VPN subnet (example — replace with your VPN CIDR)
    10.8.0.0/24      1;   # OpenVPN / WireGuard tunnel net
    192.168.100.0/24 1;   # Office LAN
}

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hq.prithvigrid.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hq.prithvigrid.com;

    # ── SSL Certificates ───────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/hq.prithvigrid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hq.prithvigrid.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/hq.prithvigrid.com/chain.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://api.prithvigrid.com https://api.prithvigrid.com;" always;

    # ── Document root ─────────────────────────────────────────────────────
    root /var/www/hq/dist;
    index index.html;

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/hq.prithvigrid.com.access.log combined;
    error_log  /var/log/nginx/hq.prithvigrid.com.error.log warn;

    # ── IP allowlist enforcement ───────────────────────────────────────────
    # Returns 403 for any IP not in the geo block above.
    if ($hq_allowed = 0) {
        return 403 "Access restricted. Contact the system administrator.";
    }

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        image/svg+xml;

    # ── Static asset caching (Vite hashed filenames) ──────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
